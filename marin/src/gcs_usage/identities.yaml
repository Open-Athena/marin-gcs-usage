# Canonical identity map for storage/cost attribution.
#
# Canonical user ids use the `rigging.provenance.sanitize_username` spelling
# (email-like logins drop their domain; lowercase; anything outside [a-z0-9_-]
# collapses to '-'). A raw spelling that sanitizes directly to a canonical id
# needs no alias entry; `aliases` cover everything else (short handles,
# initials) as observed in Iris job owners, provenance `built_by`, and
# `users/<seg>/` path segments. The attribution job reports unknown-team users
# — curate them into this file rather than letting them accumulate.
#
# Optional display fields (consumed by the web UI via `scripts/gen-identities-ts`
# -> site/src/identities.gen.ts; see specs/avatar-sources.md):
#   name:    short display name (the UI shows this, not the raw email). Defaults
#            to the capitalized first segment of the id, so only spell it out for
#            multi-word / non-obvious first names.
#   github:  GitHub login for the real avatar (github.com/<login>.png). WITHOUT
#            this we'd guess the login from the id and silently show the wrong
#            face; leave it unset rather than guess. Fill one per person as
#            confirmed — Will = Helw150, not the guessed `will-held`.
# Groups (the storage-attribution axis; "group" in the UI) — by employer, plus a
# shared bucket, since employer is the unambiguous split:
#   oa        — Open Athena employees (incl. everyone on the Marin core team)
#   stanford  — Percy's students' research (Percy manages)
#   communal  — shared data/infra used across orgs (raw -> normalized ->
#               tokenized corpora, datakit, shared sweep checkpoints); no single
#               user/org owner. Both Stanford and OA train on it (verified via
#               W&B run configs, 2026-08-11).
