[project]
name = "marin-gcs-usage"
version = "0.1.0"
description = "Per-user attribution and reporting for Marin GCS storage"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "duckdb>=1.0",
    "fsspec>=2024.0.0",
    "gcsfs>=2024.0.0",
    "google-cloud-storage>=2.14",
    "pandas>=2.0",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    # `gcs-usage digest` drives Slack via thrds; pinned to the `py` branch (has
    # editable image blocks + per-message sender). Direct URL so `pip install
    # ./marin` in the image resolves it (not just uv). Bump the SHA to update.
    "thrds @ git+https://github.com/runsascoded/thrds@200e1fd94d51832b872d30b4604e101afe429711",
]

[project.optional-dependencies]
wandb = ["wandb>=0.19"]
sheets = ["gspread>=6.0"]  # `sheet-push` → Google Sheets (ADC auth)

[project.scripts]
gcs-usage = "gcs_usage.cli:main"

[dependency-groups]
test = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcs_usage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
