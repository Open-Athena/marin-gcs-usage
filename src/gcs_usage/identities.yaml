# Manual owners for big shared prefixes that no per-user signal covers
# (datasets, ferry checkpoints, ...). `user` is optional; team-only rows are
# expected here. A `*` in the bucket position fans out over the listing's
# buckets at report time. Deepest-prefix-wins still applies, so per-user
# signals inside these trees override the team row.
prefix_owners:
  # Shared data-pipeline trees — "core" per Will's taxonomy (storage for
  # models planned for release; raw → normalized → tokenized + datakit infra).
  - prefix: gs://marin-*/raw/
    team: core
  - prefix: gs://marin-*/normalized/
    team: core
  - prefix: gs://marin-*/tokenized/
    team: core
  - prefix: gs://marin-*/datakit/
    team: core
  - prefix: gs://marin-*/data/
    team: core
  - prefix: gs://marin-*/documents/
    team: core
  - prefix: gs://marin-*/processed/
    team: core
  # Shared dataset dirs outside the standard trees
  - prefix: gs://marin-us-central2/datasets/
    team: core
  - prefix: gs://marin-us-central1/finetranslations-0d9d50/
    team: core
  - prefix: gs://marin-us-east5/finetranslations-0d9d50/
    team: core
  - prefix: gs://marin-us-east5/finepdfs_eng_Latn/
    team: core
  # Ephemeral TTL trees (auto-expiring; keep them out of the gap list)
  - prefix: gs://marin-*/tmp/
    team: core
  # Centrally-run sweep namespaces (many configs have no matching W&B run
  # name; per-user signals inside still win via deepest-prefix)
  - prefix: gs://marin-*/checkpoints/isoflop/
    team: core  # scaling-law ladders; runs by held/rohithk/larrydial et al.
  - prefix: gs://marin-*/grug/chunked_perf/
    team: core  # TODO confirm owner (grug infra sweeps)
  - prefix: gs://marin-*/grug/moe_depth_mup_lr/
    team: core  # TODO confirm owner (MoE muP LR sweeps)
  # scratch/<user>/ segments (not definitionally per-user like users/, so
  # only known-user segments are mapped)
  - prefix: gs://marin-*/scratch/ahmed/
    user: ahmed-ahmed
    team: stanford
  - prefix: gs://marin-*/scratch/kaiyue/
    user: kaiyue-wen
    team: stanford
  - prefix: gs://marin-*/scratch/michaelryan/
    user: michael-ryan
    team: stanford
  - prefix: gs://marin-*/scratch/rav/
    user: rafal-wojdyla
    team: oa
  # Personal top-level dirs predating users/<name>/ convention
  - prefix: gs://marin-us-east5/pinlin_calvin_xu/
    user: calvin-xu
    team: stanford
  - prefix: gs://marin-*/julian/
    user: julian
    team: stanford  # TODO confirm which Julian; ~22 TB of julian/experiments/ across 3 buckets
  - prefix: gs://marin-*/user/rav/
    user: rafal-wojdyla
    team: oa  # `user/` (singular) tree is ~all rav
  - prefix: gs://marin-us-central1/ttl=30d/dlwh/
    user: david-hall
    team: core
  - prefix: gs://marin-eu-west4/tomat/
    user: ryan-williams
    team: core  # TODO confirm — tomat is Ryan's CLI; results tree 2.8 TB
