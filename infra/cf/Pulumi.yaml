# One project, one stack per deployment branch (`gcs` here, `cw-s3` on the
# cw-s3 branch). The program is the shared one in `stack/` (specs/iac-templates.md
# phase 4); this branch's stack is only its `Pulumi.gcs.yaml` config. The gcs stack is
# live (adopted 2026-09-24); `up` stays user-gated (see ../specs/cf-iac.md and
# README.md).
# Distinct project name from gcp/gcs-usage so the two don't collide in the
# shared gs://oa-pulumi backend (keyed by <project>/<stack>).
name: gcs-usage-cf
description: Cloudflare resources for the storage-usage dashboards — Pages project shell, custom domain + oa.dev CNAME, D1, cache KV, and (cw-s3) the R2 serving bucket + token. Deployments + app config stay with site/deploy (wrangler).
main: stack/
backend:
  url: gs://oa-pulumi
runtime:
  name: python
  options:
    toolchain: uv
