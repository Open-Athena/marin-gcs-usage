# One project, one stack per deployment branch (`gcs` on the gcs branch, `cw-s3`
# here); each branch's cf/ selects only its own stack. The cw-s3 stack is
# initialized in the backend; adoption `up` is user-gated (see
# ../specs/cf-iac.md and README.md).
# Distinct project name from gcp/gcs-usage so the two don't collide in the
# shared gs://oa-pulumi backend (keyed by <project>/<stack>).
name: gcs-usage-cf
description: Cloudflare resources for the storage-usage dashboards — Pages project shell, custom domain + oa.dev CNAME, D1, cache KV, and (cw-s3) the R2 serving bucket + token. Deployments + app config stay with site/deploy (wrangler).
main: stack/
backend:
  url: gs://oa-pulumi
runtime:
  name: python
  options:
    toolchain: uv
config:
  gcs-usage-cf:zoneId:
    description: "Cloudflare zone id for oa.dev (holds the cw-s3.oa.dev CNAME)"
