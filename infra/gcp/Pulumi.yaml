# One project, one stack per deployment branch (`gcs` on gcs, `cw-s3` on cw-s3);
# each branch's infra/gcp/ selects only its own stack. The shared components are
# `gcp_jobs.py`, from `cloud`.
name: gcs-usage-gcp
description: A deployment's GCP resources — job service accounts, Secret Manager containers (no values), Cloud Scheduler crons (Batch / Cloud Run), bucket IAM
backend:
  url: gs://oa-pulumi
runtime:
  name: python
  options:
    toolchain: uv
config:
  gcs-usage-gcp:adopting:
    description: "Import the live resources each component marks `existing` (first `up` only; then false)"
  gcs-usage-gcp:batchDeleteEdition:
    description: "Storage Intelligence edition for managed batch deletion: DISABLED (default), TRIAL, or STANDARD"
  gcs-usage-gcp:fleetProject:
    description: "Project that owns the target buckets and is billed for their bucket-filtered Storage Intelligence enrollment"
  gcs-usage-gcp:taskLogsLocation:
    description: "Existing Logging bucket's location for the site-readable task-log view (default global)"
  gcs-usage-gcp:taskLogsBucket:
    description: "Existing Logging bucket for the site-readable task-log view (default _Default)"
