# CF Pages project config (oa-cw-s3-usage → cw-s3.oa.dev). `wrangler pages
# deploy` reads this, so bindings + vars declared here apply to the deployment
# it creates. The deployment's own sign-in (Google OIDC + emailed codes, the
# `@open-athena/auth` session model) gates the whole host; the D1 lineage is
# `migrations/cw/` (auth tables + the staged-deletion tables, from the
# `0001_init.sql` baseline).
name = "oa-cw-s3-usage"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

# Staged-deletion store (specs/staged-delete.md): D1 holds the plans, the
# executed-deletion records, and the admin allowlist (site/migrations/cw, from `0001_init.sql`).
# Create with `wrangler d1 create oa-cw-s3-usage-db` and paste the returned
# database_id below, then `wrangler d1 migrations apply oa-cw-s3-usage-db
# --remote` (needs CLOUDFLARE_ACCOUNT_ID=74981a43… + the D1-scoped token).
[[d1_databases]]
binding = "DB"
database_name = "oa-cw-s3-usage-db"
database_id = "7f1e1326-b879-4ecd-8621-846621c24f36"
# Two D1 lineages live in site/migrations/ (one per deployment; they collide on
# the folded index-footer migration). This deployment applies ITS lineage
# only: gcs's is `migrations/gcs`.
migrations_dir = "migrations/cw"
# Local dev runs against the REAL prod D1 (read-write) — dev-only: deploys
# ignore `remote`. Needs CLOUDFLARE_API_TOKEN (direnv) + CLOUDFLARE_ACCOUNT_ID.
remote = true

# Workers Logs: retain console output + uncaught exceptions from the Pages
# Functions (a few days, in the dashboard) — without this a 500 leaves no trace
# once the request is gone (`wrangler pages deployment tail` is live-only).
[observability]
enabled = true

[vars]
ROOT_LABEL = "marin CoreWeave"  # the store root's crumb label (`_lib/view.ts`)
# Deployment as configuration (the base's `vite.config.ts` reads these from
# this file at build time; `src/stores.ts` registry key + client whoami source):
STORE = "cw"                    # the store this build serves (`src/stores.ts`)
AUTH_MODE = "app"                # own sign-in: Google OIDC + emailed codes (specs/oidc-cutover-cw.md P4, 2026-09-28)
# The plan prefix shape (`_lib/plans.ts` prefixShape): CoreWeave's S3-compatible
# buckets; explicit here so the deployment declares it rather than inheriting a default.
STORE_SCHEME = "s3://"
STORE_BUCKETS = "marin-us-east-02a,hero-checkpoints"
BASE_SCOPE = "cw"
SNAPSHOTS_SUBDIR = "cw"          # this store's snapshots: snapshots/cw/ (`_lib/shared.ts` snapshotsPrefix)
# The store seam's read allow-list (`_lib/index.ts` storePrefixes, also honored
# by `/api/path-index` and `/v1/files`): the base's defaults cover `listing/`
# and `snapshots/` only; cw's index tiers live under `cw-l2/` and its sweep
# records under `cw-sweep/`, so name them here (this REPLACES the defaults).
STORE_PREFIXES = "listing/,snapshots/,sweep/,cw-sweep/,cw-l2/"
# Domain whose sign-in identities are staff (admin/sweep scope). CoreWeave
# viewers (coreweave.com) can see the dashboard but are not staff; the
# sweep-dispatch admin gate is the `admin_emails` (site/migrations/cw/0001_init.sql)
# allowlist on top of this (`ADMIN_EMAILS` says the table exists here).
STAFF_DOMAIN = "openathena.ai"
ADMIN_EMAILS = "1"
# The in-app viewer policy (specs/oidc-cutover-cw.md): these domains get the
# `cw` scope with no `allowed_emails` row.
VIEWER_DOMAINS = "coreweave.com"
# The opt-in trash model (specs/staged-delete.md): any full viewer stages
# deletions into the shared open plan (`stage_batches`, migrations/cw/0002).
STAGING = "1"
# R2 serving (specs/r2-serving-migration.md): the same store seam the base's
# r2.rbw.sh deploy uses (`_lib/index.ts` storeTarget/storeCreds — S3-over-R2,
# NOT a native R2 binding, so cw matches the base byte-for-byte). The bucket is
# the `r2_bucket` output of the `cw-s3` Pulumi stack (`cf/`); the job publishes
# each scan's served subset into it (`job/cw-run.sh` stage 4c, `dt-cloud
# publish-r2`), so the reads are byte-equivalent to GCS (same keys). FLIPPED
# 2026-09-28 (after the dev stack, 2026-09-25). The three secrets below MUST be
# set on the same environment as these two vars — `cf/sync-secrets -P` — and
# the vars must never be dropped while the secrets stay: a seam-aware build
# with the creds but no `STORE_BUCKET` reads R2 with the GCS bucket name and
# 404s every data route (the 2026-09-25 hotfix incident).
# Secrets (`cf/sync-secrets -p -P`, or `wrangler pages secret put <NAME> --project-name oa-cw-s3-usage`):
#   STORE_ENDPOINT          = https://<account id>.r2.cloudflarestorage.com
#   STORE_ACCESS_KEY_ID     = the `r2_s3_access_key_id` stack output (the R2 API token's id)
#   STORE_SECRET_ACCESS_KEY = the `r2_s3_secret_access_key` stack output (sha256 of the token value)
# `STORE_PREFIXES` is set above (the base's defaults no longer include `cw-l2/`).
STORE_BUCKET = "oa-cw-s3-usage-index"   # `r2_bucket` output; R2 ignores the region, SigV4 wants one
STORE_REGION = "auto"


# Global cache tier for the index reader's JSON (`functions/_lib/edgeCache.ts`:
# colo cache → KV; gcs binds `CACHE_KV`). Optional — the code runs without it
# (colo cache only), but then the job's warm-cache reaches ONE datacenter.
# The namespace is the `cache_kv_id` output of this branch's CF Pulumi stack
# (`cf/__main__.py`, Store.kv_name = "oa-cw-s3-usage-cache"), created 2026-09-25.
[[kv_namespaces]]
binding = "CACHE_KV"
id = "1dbc4c60884c4f3ba61aa1aa79f494bc"

# Secrets (set with `wrangler pages secret put <NAME> --project-name oa-cw-s3-usage`):
#   SESSION_SECRET   — HMAC key for session cookies + IP hashing (the app
#     session model, specs/oidc-cutover-cw.md; absent = sign-in 503s)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET — the "cw-s3.oa.dev" OAuth Web client
#   RESEND_API_KEY / MAIL_FROM — emailed-code sign-in (noreply@oa.dev)
#   GCS_HMAC_KEY_ID / GCS_HMAC_SECRET — read-only GCS proxy creds (data + /files)
#   GCP_SA_KEY — JSON key for `gcs-usage-dispatch@oa-internal-450019` (Batch
#     submit/cancel for /api/sweep/*; `batch.jobsEditor` + actAs `gcs-usage-job`)

# ---------------------------------------------------------------------------
# Preview environment — the dev stack (`site/deploy --dev` → `--branch dev` →
# https://dev.cw-s3.oa.dev, a CNAME onto the branch alias
# dev.oa-cw-s3-usage.pages.dev; `cf/` owns the record). Same sign-in as
# production (Google OIDC + emailed codes). Real prod data, unmerged code:
# where the R2 / KV flips and a new base get their real numbers before prod.
# Pages rule: `vars`, `d1_databases`, `kv_namespaces` are non-inheritable — the
# moment ONE is overridden here, ALL must be restated, so this block mirrors
# production and differs only where a line says so. Secrets are per-environment
# too: `wrangler pages secret put <NAME> --project-name oa-cw-s3-usage --env preview`
# (the GCS HMAC pair is set there; `GCP_SA_KEY` is not — no sweep dispatch from dev).
# ---------------------------------------------------------------------------
[[env.preview.d1_databases]]
binding = "DB"
database_name = "oa-cw-s3-usage-db"   # the SAME ledger as prod (marks made on dev are real)
database_id = "7f1e1326-b879-4ecd-8621-846621c24f36"
migrations_dir = "migrations/cw"

[env.preview.vars]
ROOT_LABEL = "marin CoreWeave (dev)"
STORE = "cw"
AUTH_MODE = "app"                     # own sign-in (specs/oidc-cutover-cw.md P3); production flips at P4
STORE_SCHEME = "s3://"
STORE_BUCKETS = "marin-us-east-02a,hero-checkpoints"
BASE_SCOPE = "cw"
SNAPSHOTS_SUBDIR = "cw"
STORE_PREFIXES = "listing/,snapshots/,sweep/,cw-sweep/,cw-l2/"
STAFF_DOMAIN = "openathena.ai"
ADMIN_EMAILS = "1"
VIEWER_DOMAINS = "coreweave.com"
# The opt-in trash model (specs/staged-delete.md): any full viewer stages
# deletions into the shared open plan (`stage_batches`, migrations/cw/0002).
STAGING = "1"
# R2, flipped here first (2026-09-25) and in production on 2026-09-28
# (specs/r2-serving-migration.md step 6): same bucket, preview-scoped secrets.
STORE_BUCKET = "oa-cw-s3-usage-index"
STORE_REGION = "auto"

# The KV tier for the dev stack: same namespace as production (a shared global
# cache is correct — same keys, same data; `CACHE_V` versions the entries).
[[env.preview.kv_namespaces]]
binding = "CACHE_KV"
id = "1dbc4c60884c4f3ba61aa1aa79f494bc"
