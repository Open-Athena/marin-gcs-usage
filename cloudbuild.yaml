# Job image build with layer caching: `--cache-from` the last :latest (built
# with an inline cache) so unchanged layers — node deps, the site and ui
# builds, wrangler, the disk-tree install — are reused, and a gcs-usage-only
# change rebuilds just its own layers. First build after enabling is cold.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull "$_IMAGE" || true
        DOCKER_BUILDKIT=1 docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$_IMAGE" \
          --build-arg JOB="$_JOB" \
          -t "$_IMAGE" .
images: ["$_IMAGE"]
substitutions:
  _JOB: run.sh   # `cw-run.sh` for the CoreWeave scan image (job/build.sh sets it by tag)
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
