name: Healthcheck

# Live-site serving health for gcs.oa.dev, independent of the test suite: hits
# the running site (latest scan) and fails if it isn't servable — the class of
# outage a green data pipeline can still cause (2026-08-31: a scan whose D1
# index footer never synced → the owner rollup 1102'd → /users blank).
#
# Needs a read-only grant token per host in the repo secrets (`GCS_USAGE_TOKEN`,
# `CW_S3_USAGE_TOKEN`); a matrix entry skips (exit 0) when its secret is absent.
on:
  schedule:
    - cron: "17 * * * *" # hourly, offset off the top of the hour
  workflow_dispatch:

jobs:
  healthcheck:
    # Both OA deployments, from the default branch: GitHub only runs
    # `schedule:` workflows from the default branch (gcs), so cw-s3's own copy
    # of this file (on the cw-s3 branch) only ever fires by dispatch. Each
    # entry probes its live host with its own read-only grant token; cw
    # publishes under `/data/cw/` (`SNAPSHOTS_SUBDIR` → `dt-cloud healthcheck -s`).
    name: ${{ matrix.host }} serving health
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: gcs.oa.dev
            secret: GCS_USAGE_TOKEN
            subdir: ""
          - host: cw-s3.oa.dev
            secret: CW_S3_USAGE_TOKEN
            subdir: cw
    env:
      GCS_USAGE_TOKEN: ${{ secrets[matrix.secret] }}
      GCS_USAGE_URL: https://${{ matrix.host }}
      SNAPSHOTS_SUBDIR: ${{ matrix.subdir }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      # `ui/dist` must exist: dt-cloud depends on the repo-root `disk-tree`
      # package, whose wheel force-includes `ui/dist` as `disk_tree/static`
      # (a bare checkout has none → hatchling "Forced include not found";
      # every hourly run failed from the 2026-09-28 cutover to the base until
      # this). The CLI doesn't need the assets — same trick as ci.yml.
      - name: Sync dt-cloud
        run: mkdir -p ui/dist && cd cloud && uv sync

      - name: Run healthcheck
        run: |
          if [ -z "${GCS_USAGE_TOKEN:-}" ]; then
            echo "${{ matrix.secret }} secret not set — skipping live healthcheck"
            exit 0
          fi
          cd cloud && uv run --no-sync dt-cloud healthcheck
