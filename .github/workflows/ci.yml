name: CI

on:
  push:
    branches: [gcs]
  pull_request:
    branches: [gcs]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create empty ui/dist for editable install
        run: mkdir -p ui/dist

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ -v

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Create empty ui/dist for editable install
        run: mkdir -p ui/dist

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run mypy
        run: uv run mypy src/disk_tree --ignore-missing-imports
        continue-on-error: true  # Don't fail build on type errors for now

  ui-build:
    name: UI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field;
        # passing `version:` here on top of that is a hard error in v4.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: cd ui && pnpm tsc --noEmit

      - name: Build
        run: cd ui && pnpm build

  react-widgets:
    name: "@disk-tree/react (typecheck + test)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field;
        # passing `version:` here on top of that is a hard error in v4.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: cd packages/react && pnpm typecheck

      - name: Test
        run: cd packages/react && pnpm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python setup for server
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      # Node.js setup for UI build and Playwright
      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field;
        # passing `version:` here on top of that is a hard error in v4.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: cd ui && pnpm build

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Install Playwright browsers
        run: cd ui && pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: cd ui && pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  marin-test:
    name: marin CLI tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # marin has its own pyproject/venv (separate from the root disk_tree,
      # which the viz tests import — install it into the same venv, as the
      # Batch image does). The root wheel force-includes `ui/dist`; stub it
      # (the viz tests don't touch the static UI, and building it here would
      # drag node+pnpm into a python test job).
      - name: Sync marin
        run: mkdir -p ui/dist && cd marin && uv sync --group test && uv pip install ..

      - name: Run marin tests
        run: cd marin && uv run --no-sync pytest tests -v

  site-build:
    name: Site typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` = `tsc -b && vite build` — typechecks the SPA (+ referenced
      # projects) and the Functions, then bundles. Catches a broken site/ before
      # a manual `site/deploy` ships it.
      - name: Build site (typecheck + bundle)
        run: cd site && pnpm build
